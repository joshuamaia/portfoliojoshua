<nav class="nav" aria-label="Main navigation">
  <ul id="nav-links" class="nav-links" [class.open]="menuAberto()">
    @for (menuItem of itensMenu; track menuItem.routerLink) {
      <app-menu-item [menuItem]="menuItem" (navigate)="fecharMenu()"></app-menu-item>
    }
  </ul>

  <div class="nav-actions">
    <app-exibir-download-curriculo variant="icon"></app-exibir-download-curriculo>
    <button
      type="button"
      class="icon-btn theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [title]="isDark() ? 'Light theme' : 'Dark theme'"
    >
      <fa-icon [icon]="isDark() ? ['fas', 'sun'] : ['fas', 'moon']"></fa-icon>
    </button>
    <button
      type="button"
      class="icon-btn nav-toggle"
      (click)="menuAberto.set(!menuAberto())"
      [attr.aria-expanded]="menuAberto()"
      aria-controls="nav-links"
      aria-label="Toggle navigation"
    >
      <fa-icon [icon]="menuAberto() ? ['fas', 'xmark'] : ['fas', 'bars']"></fa-icon>
    </button>
  </div>
</nav>
