<li class="nav-item-x">
  <a
    class="nav-link-x"
    [routerLink]="menuItem.routerLink"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{ exact: true }"
    (click)="navigate.emit()"
  >
    <fa-icon [icon]="menuItem.icon"></fa-icon>
    <span>{{ menuItem.title }}</span>
  </a>
</li>
