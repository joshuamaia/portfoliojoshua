@if (variant === 'icon') {
  <button
    type="button"
    class="icon-btn"
    (click)="open(curriculo)"
    aria-label="View resume"
    title="Resume (PDF)"
  >
    <fa-icon [icon]="['fas', 'file-pdf']"></fa-icon>
  </button>
} @else {
  <button type="button" class="btn-x btn-primary-x" (click)="open(curriculo)">
    <fa-icon [icon]="['fas', 'file-pdf']"></fa-icon> View resume
  </button>
}

<ng-template #curriculo let-modal>
  <div class="modal-head">
    <div>
      <h2 class="modal-title-x">Resume</h2>
      <p class="modal-sub">{{ nome }}</p>
    </div>
    <div class="modal-actions">
      <a class="btn-x btn-ghost-x btn-sm-x" [href]="pdfSrc" [attr.download]="nomeArquivo">
        <fa-icon [icon]="['fas', 'download']"></fa-icon> Download
      </a>
      <a
        class="icon-btn"
        [href]="pdfSrc"
        target="_blank"
        rel="noopener"
        aria-label="Open in new tab"
        title="Open in new tab"
      >
        <fa-icon [icon]="['fas', 'arrow-up-right-from-square']"></fa-icon>
      </a>
      <button type="button" class="icon-btn" (click)="modal.dismiss()" aria-label="Close">
        <fa-icon [icon]="['fas', 'xmark']"></fa-icon>
      </button>
    </div>
  </div>
  <div class="modal-pdf">
    <pdf-viewer
      [src]="pdfSrc"
      [render-text]="true"
      [original-size]="false"
      style="display: block; width: 100%; height: 100%"
    ></pdf-viewer>
  </div>
</ng-template>
