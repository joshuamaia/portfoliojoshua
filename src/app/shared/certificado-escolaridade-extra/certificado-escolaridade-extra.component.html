<article class="card-x course-card">
  <button
    type="button"
    class="course-thumb"
    (click)="open(certificado)"
    [attr.aria-label]="'View certificate: ' + titulo"
  >
    <img [src]="srcImage" alt="" loading="lazy" decoding="async" />
    <span class="course-thumb-overlay">
      <fa-icon [icon]="['fas', 'expand']"></fa-icon> View certificate
    </span>
  </button>
  <div class="course-body">
    <h2 class="card-title">{{ titulo }}</h2>
    <p class="text-soft">{{ descricao }}</p>
  </div>
</article>

<ng-template #certificado let-modal>
  <div class="modal-head">
    <h2 class="modal-title-x">{{ titulo }}</h2>
    <button type="button" class="icon-btn" (click)="modal.dismiss()" aria-label="Close">
      <fa-icon [icon]="['fas', 'xmark']"></fa-icon>
    </button>
  </div>
  <div class="modal-media">
    <img [src]="srcImage" [alt]="'Certificate: ' + titulo" />
  </div>
</ng-template>
