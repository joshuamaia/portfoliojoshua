<section class="container-x page">
  <app-page-header
    eyebrow="Career"
    title="Work Experience"
    [subtitle]="profile.yearsOfExperience + '+ years building corporate systems across the public and private sectors.'"
  ></app-page-header>

  <ol class="timeline">
    @for (job of experiences; track job.company; let first = $first) {
      <li class="timeline-item" [class.is-current]="!job.end" appReveal>
        <span class="timeline-dot" aria-hidden="true"></span>
        <app-trabalho-item [job]="job" [expandido]="first"></app-trabalho-item>
      </li>
    }
  </ol>
</section>
