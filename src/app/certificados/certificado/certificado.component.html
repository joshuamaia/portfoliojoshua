<section class="container-x page">
  <app-page-header
    eyebrow="Credentials"
    title="Certificates"
    subtitle="Professional certifications in Java, cloud, software architecture, Scrum and DevOps. Click to view."
  ></app-page-header>

  @for (grupo of grupos; track grupo.title) {
    <app-certificado-item [titulo]="grupo.title" [icon]="grupo.icon" [total]="grupo.items.length" appReveal>
      @for (cert of grupo.items; track cert.image) {
        <app-certificado-template
          [titulo]="cert.title"
          [meta]="cert.meta"
          [srcImage]="cert.image"
        ></app-certificado-template>
      }
    </app-certificado-item>
  }
</section>
