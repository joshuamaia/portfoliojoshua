<section class="container-x page">
  <app-page-header
    eyebrow="Continuous learning"
    title="Bootcamps & Courses"
    subtitle="Intensive hands-on programs. Click a card to view the certificate."
  ></app-page-header>

  <div class="course-grid">
    @for (curso of cursos; track curso.title; let i = $index) {
      <app-certificado-escolaridade-extra
        [titulo]="curso.title"
        [srcImage]="curso.image"
        [descricao]="curso.description"
        appReveal
        [revealDelay]="(i % 3) * 70"
      ></app-certificado-escolaridade-extra>
    }
  </div>
</section>
