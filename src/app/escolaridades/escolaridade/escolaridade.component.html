<section class="container-x page">
  <app-page-header
    eyebrow="Education"
    title="Academic Background"
    subtitle="Degrees, MBAs and postgraduate programs in software engineering, architecture and AI."
  ></app-page-header>

  <div class="section-head" appReveal>
    <h2 class="section-title-sm">Current &amp; recent programs</h2>
  </div>
  <div class="edu-grid">
    @for (item of recentes; track item.title) {
      <app-escolaridade-item [item]="item" appReveal></app-escolaridade-item>
    }
  </div>

  <div class="section-head" appReveal>
    <h2 class="section-title-sm">Completed</h2>
  </div>
  <div class="edu-grid">
    @for (item of concluidos; track item.title) {
      <app-escolaridade-item [item]="item" appReveal></app-escolaridade-item>
    }
  </div>
</section>
